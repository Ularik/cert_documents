services:

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    volumes:
      - postgres_data_admin:/var/lib/postgresql/data
    env_file:
      - .env

  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes # 5. Включение постоянного сохранения на диск
    healthcheck: # 6. Проверка здоровья контейнера
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    container_name: backend
    build: .
    command: sh -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    restart: always
    depends_on:
      postgres:
        condition: service_started

    env_file:
      - .env

  celery_worker:
    build:
      context: .
    env_file:
      - .env
    command: celery -A celery_app.celery_app:celery_instance worker --loglevel=INFO
    depends_on:
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: .
    env_file:
      - .env
    command: celery -A celery_app.celery_app:celery_instance beat --loglevel=INFO
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../cert_admin_front
      dockerfile: Dockerfile
    container_name: front
    restart: always
    environment:
      NEXT_API_URL: http://nginx/api
    env_file:
      - ../cert_admin_front/dashboard/.env
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: nginx_server
    restart: always
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data_admin:
  redis_data:
